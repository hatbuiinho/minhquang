services:
  minhquang-be:
    build:
      context: .
      dockerfile: be/Dockerfile
    container_name: minhquang-be
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      OTA_STORAGE_DIR: /app/storage/ota
    # ports:
    #   - "${API_PORT:-8080}:8080"
    volumes:
      - ./ota-storage:/app/storage/ota
      - ./be/secrets:/app/secrets:ro
    networks:
      - nginx_network

  minhquang-fe:
    build:
      context: .
      dockerfile: fe/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    container_name: minhquang-fe
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "${PUBLIC_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - nginx_network

  ota-publisher:
    build:
      context: .
      dockerfile: fe/Dockerfile.ota
    profiles:
      - tools
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      VITE_OTA_CHANNEL: ${OTA_CHANNEL:-production}
      VITE_NATIVE_VERSION: ${NATIVE_VERSION:-1.0}
    volumes:
      - ./ota-storage:/workspace/be/storage/ota
    command: yarn ota:publish
    networks:
      - nginx_network

networks:
  nginx_network:
    external: true
